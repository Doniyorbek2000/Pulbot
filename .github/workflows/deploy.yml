name: Serverga deploy

# Kod main'ga tushganda avtomatik deploy qiladi.
# Qo'lda ishga tushirish uchun: Actions -> Serverga deploy -> Run workflow
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Bir vaqtda faqat bitta deploy ishlasin
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    name: Testlar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Bog'liqliklarni o'rnatish
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Testlarni ishga tushirish
        run: python -m pytest -q

  deploy:
    name: Deploy
    needs: test          # testlar yiqilsa deploy bo'lmaydi
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Server orqali yangilash
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            cd /opt/pulbot
            sudo ./deploy/deploy.sh update
